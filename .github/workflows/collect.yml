name: Thu thap tin truong hoc

# Lịch tự chạy đang TẮT: máy GitHub (ở nước ngoài) không vào được web *.quangtri.edu.vn (thử ngày 06/11/2026:
# 19/20 trường không kết nối được). Thu thập tin chạy trên máy tính ở Việt Nam bằng collector/chay_thu_thap.bat.
# Nếu sau này web trường mở truy cập quốc tế, bỏ dấu # ở 3 dòng schedule dưới đây.
on:
  # schedule:
  #   - cron: "45 22 * * *"   # 05:45 giờ Việt Nam
  #   - cron: "45 5 * * *"    # 12:45 giờ Việt Nam
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lấy lại bộ nhớ lần chạy trước (bài cũ, ảnh đã tải)
        uses: actions/cache/restore@v4
        with:
          path: collector/collector_state.json
          key: collector-state-${{ github.run_id }}
          restore-keys: collector-state-
      - name: Thu thập tin
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
        run: python main.py
      - name: Lưu bộ nhớ cho lần sau
        if: always()
        uses: actions/cache/save@v4
        with:
          path: collector/collector_state.json
          key: collector-state-${{ github.run_id }}
